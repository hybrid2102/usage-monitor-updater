name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            $errors = @($results | Where-Object Severity -eq 'Error')
            if ($errors) { throw "$($errors.Count) analyzer error(s)." }
            Write-Host "::warning::$($results.Count) analyzer warning(s) - see the table above."
          }
          else {
            Write-Host 'No findings.'
          }

  # The two editions are separate jobs rather than a matrix on purpose: the `shell:`
  # key does not accept the matrix context (GitHub rejects the whole workflow with
  # "Unrecognized named-value: 'matrix'"), so the interpreter cannot be parameterised.
  # Both are exercised because they differ in ways that have already caused a real bug -
  # see Get-HttpErrorInfo.

  test-pwsh:
    name: Pester (PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './testresults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results-pwsh
          path: ./testresults.xml
          if-no-files-found: ignore

  test-windows-powershell:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './testresults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results-windows-powershell
          path: ./testresults.xml
          if-no-files-found: ignore

  syntax:
    name: Parse check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse every script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($failed) { throw 'One or more scripts failed to parse.' }

  smoke:
    name: Smoke test (-WhatIf)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the script end to end without changing anything
        shell: pwsh
        run: |
          # The unit tests cover pure functions; nothing else proves the script actually
          # runs. This exercises the real flow - argument binding, the GitHub call, asset
          # selection, the changelog renderer - while -WhatIf blocks every side effect.
          $probe = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Path $probe -Force | Out-Null

          & ./Update-UsageMonitor.ps1 -InstallDir $probe -ExeName 'Probe.exe' -NonInteractive -WhatIf
          $code = $LASTEXITCODE

          # Exit code 3 is a network/rate-limit problem, not a defect in the script:
          # unauthenticated GitHub API calls from shared runner IPs do get throttled.
          if ($code -eq 3) {
            Write-Host '::warning::GitHub API unreachable or rate limited - smoke test inconclusive.'
            exit 0
          }
          if ($code -ne 0) { throw "Smoke test failed with exit code $code." }

          $leftovers = @(Get-ChildItem -LiteralPath $probe -Force)
          if ($leftovers.Count -gt 0) {
            $leftovers | ForEach-Object { Write-Host "unexpected: $($_.Name)" }
            throw '-WhatIf must not create any file.'
          }
          Write-Host 'Smoke test passed and left no files behind.'
